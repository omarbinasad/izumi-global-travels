  <!-- BLADE BOUNDARY: main content -> @yield('content') -->
  <!--
    A page of its own: the photograph is the page, and the card sits on it.
    The image is decorative — everything readable is in the markup over it.
  -->
  <main class="auth-screen" id="main-content">
    <img class="auth-screen__media" src="../../assets/images/loginbg.webp" alt=""
         width="1664" height="936" fetchpriority="high" decoding="async">

    <a class="auth-screen__logo" href="../../index.html" aria-label="Izumi Global Travels — home">
      <svg class="size-[34px] flex-none icon--solid" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="20" fill="#1668e0"/>
        <path d="M9 25c6-1 11-4 15-8 1.5-1.5 3-3.4 4-5.6-.6 4.6-2.6 8.4-5.6 11.1-3.3 3-8 4.4-13.4 2.5z" fill="#fff"/>
        <path d="M13 30c8 1 15-2 19-8-1 6.5-6 11-13 11-2.2 0-4.3-1-6-3z" fill="#bfd7fe"/>
      </svg>
      <span>
        <span class="site-logo__name">Izumi</span>
        <span class="site-logo__tagline">Global Travels</span>
      </span>
    </a>

    <!-- BLADE BOUNDARY: auth panel -> <x-auth.panel :tab="$tab" /> -->
    <!--
      Both forms POST to Laravel, which authenticates, applies its own rate
      limiting and returns the errors. Nothing here signs anyone in: there is
      no session, no token and no credential in this page, and the static
      prototype has nothing to post to. Blade adds @csrf to each form.
    -->
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 class="auth-card__title" id="auth-title">Welcome to Izumi</h1>
      <p class="auth-card__lead">Book faster and manage your travel requests in one place.</p>

      <!-- Radios, not buttons: the two forms swap with no JavaScript, and the
           chosen tab is a real form value the backend can render back. -->
      <input class="auth-tab__input sr-only" type="radio" name="auth-tab" id="auth-tab-login" checked>
      <input class="auth-tab__input sr-only" type="radio" name="auth-tab" id="auth-tab-register">

      <div class="auth-tabs">
        <label class="auth-tab" for="auth-tab-login">Log in</label>
        <label class="auth-tab" for="auth-tab-register">Create account</label>
      </div>

      <!-- ----------------------------------------------------------- log in -->
      <form class="auth-form auth-form--login" method="post" action="login.html" data-validate novalidate>
        <div class="field-grid">
          <div class="field field--wide">
            <label class="field__label" for="login-email">Email address</label>
            <input class="field__control" type="email" id="login-email" name="email"
                   placeholder="name@example.com" autocomplete="email" required
                   data-required="Enter the email address you signed up with.">
            <span class="field__error" data-field-error hidden></span>
          </div>

            <div class="field field--wide">
              <label class="field__label" for="login-password">Password</label>
              <span class="field__password">
                <input class="field__control" type="password" id="login-password" name="password"
                       autocomplete="current-password"
                       placeholder="Your password" required
                       data-required="Enter your password." data-password>
              </span>
              <span class="field__error" data-field-error hidden></span>
            </div>
        </div>

        <div class="auth-form__row">
          <label class="auth-form__remember">
            <input type="checkbox" name="remember" value="1">
            Keep me signed in
          </label>

          <a class="auth-form__link" href="login.html">Forgotten your password?</a>
        </div>

        <button class="btn btn--primary auth-form__submit" type="submit">
          Log in
          <svg class="icon size-4" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
        </button>

        <p class="auth-form__swap">
          New here? <label class="auth-form__link" for="auth-tab-register">Create an account</label>
        </p>
      </form>

      <!-- --------------------------------------------------- create account -->
      <form class="auth-form auth-form--register" method="post" action="login.html" data-validate novalidate>
        <div class="field-grid">
          <div class="field">
            <label class="field__label" for="register-name">Full name</label>
            <input class="field__control" type="text" id="register-name" name="name"
                   placeholder="Your name" autocomplete="name" required
                   data-required="Tell us what to call you.">
            <span class="field__error" data-field-error hidden></span>
          </div>

          <div class="field">
            <label class="field__label" for="register-phone">Phone number</label>
            <input class="field__control" type="tel" id="register-phone" name="phone"
                   placeholder="1XXXXXXXXX" autocomplete="tel-national" required
                   inputmode="numeric" pattern="[0-9]{6,15}" maxlength="15" data-digits
                   data-required="Enter a phone number we can reach you on."
                   data-invalid="Enter the phone number in digits only, 6 to 15 of them.">
            <span class="field__error" data-field-error hidden></span>
          </div>

          <div class="field field--wide">
            <label class="field__label" for="register-email">Email address</label>
            <input class="field__control" type="email" id="register-email" name="email"
                   placeholder="name@example.com" autocomplete="email" required
                   data-required="Enter an email address we can send the booking to.">
            <span class="field__error" data-field-error hidden></span>
          </div>

            <div class="field field--wide">
              <label class="field__label" for="register-password">Password</label>
              <span class="field__password">
                <input class="field__control" type="password" id="register-password" name="password"
                       autocomplete="new-password"
                       placeholder="At least 8 characters" required minlength="8"
                       aria-describedby="register-password-hint"
                       data-required="Choose a password."
                       data-invalid="Use at least 8 characters." data-password>
              </span>
              <span class="field__hint" id="register-password-hint">Eight characters or more. The rest is checked when you submit.</span>
              <span class="field__error" data-field-error hidden></span>
            </div>

            <div class="field field--wide">
              <label class="field__label" for="register-confirm">Confirm password</label>
              <span class="field__password">
                <input class="field__control" type="password" id="register-confirm" name="password_confirmation"
                       autocomplete="new-password"
                       placeholder="Type it again" required data-match="register-password"
                       data-required="Type the password again."
                       data-invalid="The two passwords do not match." data-password>
              </span>
              <span class="field__error" data-field-error hidden></span>
            </div>

          <div class="field field--wide">
            <label class="auth-form__remember auth-form__remember--top">
              <input type="checkbox" name="terms" value="1" required
                     data-required="Accept the terms to create an account.">
              <span>
                I accept the <a href="../legal/terms.html">Terms &amp; Conditions</a>
                and the <a href="../legal/privacy-policy.html">Privacy Policy</a>.
              </span>
            </label>
            <span class="field__error" data-field-error hidden></span>
          </div>
        </div>

        <button class="btn btn--primary auth-form__submit" type="submit">
          Create account
          <svg class="icon size-4" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
        </button>

        <p class="auth-form__swap">
          Already have an account? <label class="auth-form__link" for="auth-tab-login">Log in</label>
        </p>
      </form>
    </section>
    <!-- END BLADE BOUNDARY: auth panel -->
  </main>
  <!-- END BLADE BOUNDARY: main content -->

  <!-- BLADE BOUNDARY: back to top -> <x-layout.to-top /> -->
  <!-- A link, not a button: "#top" is the top of the document in HTML, so this
       returns there with the stylesheet's smooth scroll and nothing running. -->
  <a class="to-top" href="#top" data-to-top>
    <svg class="icon size-5" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
    <span class="sr-only">Back to top</span>
  </a>
  <!-- END BLADE BOUNDARY: back to top -->

  <script type="module" src="../../assets/js/main.js"></script>
</body>
</html>
