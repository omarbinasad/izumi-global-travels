    <!-- BLADE BOUNDARY: new password panel -> <x-auth.new-password-panel /> -->
    <!--
      Where the link in the reset email lands. Laravel owns every part of the
      security here: it signs the link, checks the token has not been used or
      expired, and applies its own password rules to what is typed. The two
      checks below only stop the obvious before a round trip.

      The token and the address ride in hidden fields because they identify the
      request, not the person: whoever holds the link can set the password,
      which is why the link is single-use and short-lived.
    -->
    <section class="auth-card" aria-labelledby="new-password-title">
      <h1 class="auth-card__title" id="new-password-title">Set a new password</h1>
      <p class="auth-card__lead">For <b>tanvir.ahmed@example.com</b>. Choose something you have not used here before.</p>

      <form class="auth-form" method="post" action="login.html" data-validate novalidate>
        <!-- Blade: $token and $email from the signed route. -->
        <input type="hidden" name="token" value="SIGNED-TOKEN">
        <input type="hidden" name="email" value="tanvir.ahmed@example.com">

        <div class="field-grid">
          <div class="field field--wide">
            <label class="field__label" for="new-password">New password</label>
            <span class="field__password">
              <input class="field__control" type="password" id="new-password" name="password"
                     autocomplete="new-password"
                     placeholder="At least 8 characters" required minlength="8"
                     aria-describedby="new-password-hint"
                     data-required="Choose a password."
                     data-invalid="Use at least 8 characters." data-password>
            </span>
            <span class="field__hint" id="new-password-hint">Eight characters or more. The rest is checked when you submit.</span>
            <span class="field__error" data-field-error hidden></span>
          </div>

          <div class="field field--wide">
            <label class="field__label" for="new-password-confirm">Confirm new password</label>
            <span class="field__password">
              <input class="field__control" type="password" id="new-password-confirm" name="password_confirmation"
                     autocomplete="new-password"
                     placeholder="Type it again" required data-match="new-password"
                     data-required="Type the password again."
                     data-invalid="The two passwords do not match." data-password>
            </span>
            <span class="field__error" data-field-error hidden></span>
          </div>
        </div>

        <button class="btn btn--primary auth-form__submit" type="submit">
          Save new password
          <svg class="icon size-4" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
        </button>

        <p class="auth-form__swap">
          <a class="auth-form__link" href="login.html">Back to log in</a>
        </p>
      </form>
    </section>
    <!-- END BLADE BOUNDARY: new password panel -->
  </main>
